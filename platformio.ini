; PlatformIO project for XIAO ESP32-C3 — Wheelo CMG balancing robot.
; Flash via USB:   pio run -e usb -t upload
; Flash via OTA:   pio run -e ota -t upload   (robot must be on WiFi)

[common]
platform  = espressif32
board     = seeed_xiao_esp32c3
framework = arduino
lib_deps  =
    madhephaestus/ESP32Servo @ ^3.0.5

[env:usb]
platform      = ${common.platform}
board         = ${common.board}
framework     = ${common.framework}
lib_deps      = ${common.lib_deps}
monitor_speed = 115200
upload_speed  = 921600

[env:ota]
platform        = ${common.platform}
board           = ${common.board}
framework       = ${common.framework}
lib_deps        = ${common.lib_deps}
monitor_speed   = 115200
upload_protocol = espota
upload_port     = wheelo.local
upload_flags    = --auth=wheelo123
